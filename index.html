
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCC NOTAMS FAA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark main-navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-airplane-engines me-2"></i>
            OCC NOTAMS FAA
        </a>

        <div class="d-flex align-items-center gap-3">
            <div class="last-check">
                <i id="checkStatusIcon" class="bi bi-clock-history"></i>
                <span id="lastCheck">Last check: Loading...</span>
            </div>

            <button class="btn btn-outline-light btn-sm" id="themeToggle">
                <i class="bi bi-sun-fill"></i>
            </button>
        </div>
    </div>
</nav>

<main class="container-fluid px-4 py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h2 class="page-title">NOTAM Dashboard</h2>
            <p class="text-secondary mb-0">
                Operational NOTAM monitoring
            </p>
        </div>

        <button id="checkNotamsBtn" class="btn btn-primary px-4">
            <i class="bi bi-arrow-repeat me-2"></i>
            CHECK NOTAMS
        </button>
    </div>

    <div id="checkProgress" class="alert alert-info d-none">
        <span class="spinner-border spinner-border-sm me-2"></span>
        Checking airports and retrieving FAA NOTAMs...
    </div>

    <div id="checkResult" class="mb-3"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="summary-card">
                <div class="summary-label">Airports monitored</div>
                <div class="summary-value" id="airportCount">0</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="summary-card">
                <div class="summary-label">Active / upcoming NOTAMs</div>
                <div class="summary-value" id="notamCount">0</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="summary-card">
                <div class="summary-label">Countries monitored</div>
                <div class="summary-value" id="countryCount">0</div>
            </div>
        </div>
    </div>

    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3 gap-2">
        <h4 class="section-title mb-0">Airports and NOTAMs</h4>

        <select id="categoryFilter" class="form-select filter-select">
            <option value="all">All classifications</option>
            <option value="MIL">MIL</option>
            <option value="DOM">DOM</option>
            <option value="INT">INT</option>
        </select>
    </div>

    <div id="airportsContainer">
        <div class="loading-state">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Loading dashboard...
        </div>
    </div>

</main>

<!-- ICAO TEXT MODAL -->
<div class="modal fade" id="icaoModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-custom">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-file-text me-2"></i>
                    ICAO NOTAM TEXT
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div id="icaoNotamNumber" class="fw-bold mb-3"></div>

                <pre id="icaoPlainText" class="icao-text"></pre>
            </div>

            <div class="modal-footer">
                <button id="copyIcaoText" class="btn btn-primary">
                    <i class="bi bi-clipboard me-2"></i>
                    Copy text
                </button>

                <button class="btn btn-outline-secondary" data-bs-dismiss="modal">
                    Close
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/app.js"></script>

</body>
</html>
