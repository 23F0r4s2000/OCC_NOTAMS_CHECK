
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OCC NOTAMS FAA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid">
    
            <a href="index.html" class="navbar-brand">
                <i class="bi bi-airplane-engines-fill me-2"></i>
                OCC NOTAMS FAA
            </a>
    
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <i class="bi bi-list"></i>
            </button>
    
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-4 me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="bi bi-speedometer2 me-2"></i>
                            Dashboard
                        </a>
                    </li>
    
                    <li class="nav-item">
                        <a class="nav-link" href="airports.html">
                            <i class="bi bi-geo-alt me-2"></i>
                            Airports
                        </a>
                    </li>
                </ul>
    
                <div class="navbar-tools">
                    <span id="lastCheckContainer">
                        <i id="checkStatusIcon" class="bi bi-clock"></i>
                        <span id="lastCheck">Last check: Loading...</span>
                    </span>
    
                    <button type="button" id="themeToggle" class="btn btn-outline-light theme-toggle"
                        aria-label="Toggle theme">
                        <i class="bi bi-sun-fill"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>



    <!-- MAIN -->

    <main class="container-fluid px-4 py-4">

        <!-- HEADER -->

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">

            <div>
                <h2 class="page-title">NOTAM Dashboard</h2>

                <p class="text-secondary mb-0">
                    Operational NOTAM monitoring
                </p>
            </div>

            <button id="checkNotamsBtn" class="btn btn-primary px-4">

                <i class="bi bi-arrow-repeat me-2"></i>
                CHECK NOTAMS

            </button>

        </div>


        <!-- PROGRESS -->

        <div id="checkProgress" class="alert alert-info d-none">

            <span class="spinner-border spinner-border-sm me-2"></span>

            Retrieving NOTAMs from FAA...

        </div>


        <!-- RESULT -->

        <div id="checkResult" class="mb-4"></div>


        <!-- SUMMARY -->

        <div class="row g-3 mb-4">

            <div class="col-md-4">

                <div class="summary-card">

                    <div class="summary-label">
                        Airports checked
                    </div>

                    <div class="summary-value" id="airportCount">
                        0
                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="summary-card">

                    <div class="summary-label">
                        Airports with relevant NOTAMs
                    </div>

                    <div class="summary-value" id="notamCount">
                        0
                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="summary-card">

                    <div class="summary-label">
                        Countries monitored
                    </div>

                    <div class="summary-value" id="countryCount">
                        0
                    </div>

                </div>

            </div>

        </div>


        <!-- AIRPORTS -->

        <div class="section-toolbar">
            <h4>Airports and NOTAMs</h4>
        
            <div class="section-filters">
                <div class="airport-search">
                    <i class="bi bi-search"></i>
                    <input type="search" id="airportSearch" placeholder="Search ICAO, IATA or airport..." autocomplete="off">
                    <button type="button" id="clearAirportSearch" aria-label="Clear search">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
        
                <select id="categoryFilter" class="form-select">
                    <option value="all">All classifications</option>
                    <option value="runway">Runway closures</option>
                    <option value="taxiway">Taxiway closures</option>
                    <option value="fuel">Fuel</option>
                    <option value="navaid">Navaids</option>
                </select>
            </div>
        </div>


        <div id="airportsContainer">

            <div class="loading-state">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Loading dashboard...
            </div>

        </div>

    </main>


    <!-- ICAO TEXT MODAL -->

    <div class="modal fade" id="icaoModal" tabindex="-1">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content modal-custom">

                <div class="modal-header">

                    <h5 class="modal-title">
                        <i class="bi bi-file-text me-2"></i>
                        ICAO NOTAM TEXT
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <div id="icaoNotamNumber" class="fw-bold mb-3"></div>

                    <pre id="icaoPlainText" class="icao-text"></pre>

                </div>


                <div class="modal-footer">

                    <button id="copyIcaoText" class="btn btn-primary">

                        <i class="bi bi-clipboard me-2"></i>
                        Copy text

                    </button>

                    <button
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal"
                    >
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- SCRIPTS -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="assets/js/app.js"></script>

</body>
</html>
