<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OCC NOTAMS FAA - Airport NOTAMs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand">
                <i class="bi bi-airplane-engines-fill me-2"></i>OCC NOTAMS FAA
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <i class="bi bi-list"></i>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-4 me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-speedometer2 me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="airports.html">
                            <i class="bi bi-geo-alt me-2"></i>Airports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="notams.html">
                            <i class="bi bi-file-earmark-text me-2"></i>NOTAMs
                        </a>
                    </li>
                </ul>

                <div class="navbar-tools">
                    <span id="lastCheckContainer">
                        <i id="checkStatusIcon" class="bi bi-clock"></i>
                        <span id="lastCheck">Last check: Loading...</span>
                    </span>
                    <button type="button" id="themeToggle" class="btn btn-outline-light theme-toggle"
                        aria-label="Toggle theme">
                        <i class="bi bi-sun-fill"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid page-content">
        <div class="airport-detail-back">
            <a href="notams.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-2"></i>All NOTAMs
            </a>
        </div>

        <div class="page-heading airport-detail-heading">
            <div>
                <h2 id="detailAirportTitle">Loading airport...</h2>
                <p id="detailAirportSubtitle">All active and upcoming NOTAMs</p>
            </div>
            <div class="airport-total">
                <span id="detailNotamCount">0</span>
                <small>Active NOTAMs</small>
            </div>
        </div>

        <div id="airportNotamsMessage"></div>
        <div id="airportNotamsList">
            <div class="loading-state">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Loading airport NOTAMs...
            </div>
        </div>
    </main>

    <!-- ICAO TEXT MODAL -->
    <div class="modal fade" id="icaoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content modal-custom">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title">ICAO NOTAM TEXT</h5>
                        <small id="icaoNotamNumber" class="text-secondary"></small>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <pre id="icaoPlainText" class="icao-text"></pre>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="copyIcaoText">
                        <i class="bi bi-clipboard me-2"></i>Copy text
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/notams.js"></script>
</body>

</html>
